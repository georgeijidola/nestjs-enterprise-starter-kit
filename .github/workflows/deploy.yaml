name: Deploy NestJS App

on:
  push:
    branches: [development, staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node Environment Names
        id: env_spec
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "target=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "target=staging" >> $GITHUB_OUTPUT
          else
            echo "target=development" >> $GITHUB_OUTPUT
          fi

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Install GKE Auth Plugin
        run: |
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
          sudo apt-get update
          sudo apt-get install -y google-cloud-cli-gke-gcloud-auth-plugin

      - name: Build and Push Docker Image
        id: build_step
        run: |
          TAG="us-central1-docker.pkg.dev/${{ secrets.PROJECT_ID }}/nestjs-enterprise-repo/nestjs-enterprise-starter-kit:${{ github.sha }}"
          docker build -t $TAG .
          gcloud auth configure-docker us-central1-docker.pkg.dev
          docker push $TAG
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Deploy to GKE via Kustomize
        run: |
          gcloud container clusters get-credentials ${{ secrets.CLUSTER_NAME }} --region us-central1
          kubectl delete deployment nestjs-enterprise-starter-kit -n ${{ steps.env_spec.outputs.target }} --ignore-not-found
          cd k8s/overlays/${{ steps.env_spec.outputs.target }}
          kustomize edit set image REPLACE_WITH_IMAGE_TAG=${{ steps.build_step.outputs.image_tag }}
          kubectl apply -k .
          kubectl rollout status deployment/nestjs-enterprise-starter-kit -n ${{ steps.env_spec.outputs.target }}
